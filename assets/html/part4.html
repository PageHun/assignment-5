<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/part4.css">
    <title>Mini project</title>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="content">
                <div class="left">
                    <h2 class="left__title">To-do list</h2>
                    <ol class="left__list">
                    </ol>
                    <button class="btn-store" onclick="storeTask()">Show tasks in console</button>
                </div>
                <div class="right">
                    <form action="" class="form">
                        <fieldset>
                            <legend>Add new task</legend>                    
                            <label class="form__title">* Title</label>
                            <input type="text" class="form__input" placeholder="Type task" value="Assignment 5">
                            <label class="form__title">* Description</label>
                            <textarea name="" id="" placeholder="Describe task" class="form__textarea">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Dolorem esse, blanditiis sint architecto consectetur velit beatae quisquam reprehenderit porro sit!</textarea>
                            <button type="button" class="btn-add">Add task</button>
                        </fieldset>
                    </form>
                </div>
            </div>            
        </div>
    </div>
    <script src="../javascript/task8.js"></script>
</body>
</html>
